services:
  backend:
    build: ./backend
    container_name: eko_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - eko_data:/app/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: eko_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  eko_data:
