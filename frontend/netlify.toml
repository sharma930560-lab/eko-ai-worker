[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' http://appassets.androidplatform.net https://appassets.androidplatform.net https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://accounts.google.com; img-src 'self' data: https: http:; connect-src 'self' https://eko-field-worker-api.onrender.com https://accounts.google.com http://localhost:* http://127.0.0.1:* http://10.0.2.2:* http://appassets.androidplatform.net https://appassets.androidplatform.net; frame-src https://accounts.google.com;"
