services:
  - type: web
    name: eko-field-worker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://appassets.androidplatform.net"
      - key: DATABASE_URL
        fromDatabase:
          name: eko-postgres
          property: connectionString

databases:
  - name: eko-postgres
    plan: free
    databaseName: eko_db
    user: eko_user
